<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube稽古動画マネージャー (検索専用)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div class="max-w-5xl mx-auto p-4 sm:p-6">
        <header class="bg-indigo-600 text-white rounded-2xl p-6 shadow-md mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold flex items-center gap-2">
                    <i data-lucide="video" class="w-8 h-8"></i>
                    YouTube 稽古動画検索
                </h1>
                <p class="text-indigo-100 mt-1 text-sm sm:text-base">スプレッドシートのデータを条件で絞り込み</p>
            </div>
            <!-- スプレッドシートへのリンクボタン（必要なら自分のスプシのURLを入れてね） -->
            <a href="#" target="_blank" class="bg-indigo-800 hover:bg-indigo-900 text-white text-xs px-4 py-2 rounded-xl font-medium flex items-center gap-2 transition">
                <i data-lucide="table" class="w-4 h-4"></i> データ編集(スプシ)
            </a>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- 左側：検索フィルター -->
            <div class="md:col-span-1 space-y-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 sticky top-4">
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2 text-slate-700">
                        <i data-lucide="search" class="w-5 h-5 text-indigo-500"></i>
                        絞り込み
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">年</label>
                            <select id="filter-year" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none"><option value="">すべての年</option></select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">日付（カレンダー）</label>
                            <input type="date" id="filter-date" class="w-full border border-slate-200 rounded-xl p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">場所</label>
                            <select id="filter-location" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none"><option value="">すべての場所</option></select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">位置（前後左右）</label>
                            <select id="filter-position" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none"><option value="">すべての位置</option></select>
                        </div>
                        <button id="reset-filters" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 rounded-xl text-sm transition mt-2">条件をリセット</button>
                    </div>
                </div>
            </div>

            <!-- 右側：動画リスト表示エリア -->
            <div class="md:col-span-3 space-y-4">
                <div class="flex justify-between items-center bg-white px-5 py-3 rounded-2xl shadow-sm border border-slate-100">
                    <span class="text-sm font-medium text-slate-600">検索結果: <strong id="result-count" class="text-indigo-600">0</strong> 件</span>
                    <span id="loading-msg" class="text-xs text-indigo-500 flex items-center gap-1"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>読込中...</span>
                </div>
                <div id="video-list" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- スクリプト -->
    <script>
        lucide.createIcons();

        // ★ここにGASのURLを貼り付ける★
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyePjHRyAt3gLQh5N5-M8qZYGk4Z0PPuyaeuqdLHj56hR0D5eBRMEkX_x4DA35cPJM/exec';

        let videos = [];
        const filterYear = document.getElementById('filter-year');
        const filterDate = document.getElementById('filter-date');
        const filterLocation = document.getElementById('filter-location');
        const filterPosition = document.getElementById('filter-position');
        const videoListEl = document.getElementById('video-list');
        const loadingMsg = document.getElementById('loading-msg');

        // データの読み込み
        async function fetchVideos() {
            loadingMsg.style.display = 'flex';
            try {
                const res = await fetch(GAS_URL);
                videos = await res.json();
                videos = videos.filter(v => v.date); // 空行を除外
                
                // 日付（YYYY-MM-DDT...）をシンプルなYYYY-MM-DD形式に整形
                videos.forEach(v => {
                    if(v.date && v.date.includes('T')) {
                        v.date = v.date.split('T')[0];
                    }
                });

                updateFilterOptions();
                renderVideos();
            } catch (e) {
                console.error(e);
                alert('データの読み込みに失敗しました');
            } finally {
                loadingMsg.style.display = 'none';
            }
        }

        // セレクトボックス更新
        function updateFilterOptions() {
            const getUnique = key => [...new Set(videos.map(v => v[key]).filter(x => x))].sort();
            
            const years = [...new Set(videos.map(v => v.date ? v.date.split('-')[0] : null).filter(x => x))].sort().reverse();
            const locations = getUnique('location');
            const positions = getUnique('position');

            const currentYear = filterYear.value;
            const currentLocation = filterLocation.value;
            const currentPosition = filterPosition.value;

            filterYear.innerHTML = '<option value="">すべての年</option>' + years.map(y => `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}年</option>`).join('');
            filterLocation.innerHTML = '<option value="">すべての場所</option>' + locations.map(l => `<option value="${l}" ${l === currentLocation ? 'selected' : ''}>${l}</option>`).join('');
            filterPosition.innerHTML = '<option value="">すべての位置</option>' + positions.map(p => `<option value="${p}" ${p === currentPosition ? 'selected' : ''}>${p}</option>`).join('');
        }

        // 描画
        function renderVideos() {
            const fYear = filterYear.value;
            const fDate = filterDate.value;
            const fLoc = filterLocation.value;
            const fPos = filterPosition.value;

            const filtered = videos.filter(v => {
                if(!v.date) return false;
                const year = v.date.split('-')[0];
                if (fYear && year !== fYear) return false;
                if (fDate && v.date !== fDate) return false;
                if (fLoc && v.location !== fLoc) return false;
                if (fPos && v.position !== fPos) return false;
                return true;
            });

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
            document.getElementById('result-count').innerText = filtered.length;

            if (filtered.length === 0) {
                videoListEl.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 border border-slate-100"><i data-lucide="frown" class="w-10 h-10 mx-auto mb-2 opacity-50"></i><p class="text-sm">データが見つかりません</p></div>`;
                lucide.createIcons();
                return;
            }

            videoListEl.innerHTML = filtered.map(v => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 transition hover:shadow-md">
                    <div class="space-y-1">
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="bg-indigo-50 text-indigo-700 font-semibold text-xs px-2.5 py-1 rounded-lg">${v.date}</span>
                            <span class="bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded-lg flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i>${v.location}</span>
                            ${v.position ? `<span class="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-lg flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i>${v.position}</span>` : ''}
                        </div>
                    </div>
                    <a href="${v.url}" target="_blank" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-5 py-2.5 rounded-xl font-medium flex items-center gap-1 transition shadow-sm w-full sm:w-auto justify-center">
                        <i data-lucide="play-circle" class="w-4 h-4"></i> 動画を再生
                    </a>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // フィルターイベント
        [filterYear, filterDate, filterLocation, filterPosition].forEach(el => el.addEventListener('change', renderVideos));
        document.getElementById('reset-filters').addEventListener('click', () => {
            filterYear.value = filterDate.value = filterLocation.value = filterPosition.value = '';
            renderVideos();
        });

        // 初期起動
        fetchVideos();
    </script>
</body>
</html>
