<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>宝船稽古動画マネージャー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div class="max-w-5xl mx-auto p-4 sm:p-6">
    
    <!-- ★ IDを追加し、色の変化をフワッとさせる(transition) -->
        <header id="main-header" class="bg-indigo-600 transition-colors duration-500 text-white rounded-2xl p-6 shadow-md mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold flex items-center gap-2">
                    <i data-lucide="video" class="w-8 h-8"></i>
                    宝船 稽古動画検索
                    
                    <!-- ★ ここにアンロック時だけ表示されるバッジを仕込む -->
                    <span id="unlock-badge" class="hidden text-xs sm:text-sm font-bold bg-amber-500 text-amber-50 px-3 py-1 rounded-lg items-center gap-1 ml-2 shadow-sm animate-pulse">
                        <i data-lucide="unlock" class="w-4 h-4"></i> 限定公開データ表示中
                    </span>
                </h1>
            </div>
        </header>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- 左側：検索フィルター -->
            <div class="md:col-span-1 space-y-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 sticky top-4">
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2 text-slate-700">
                        <i data-lucide="search" class="w-5 h-5 text-indigo-500"></i>
                        絞り込み
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">年</label>
                            <select id="filter-year" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none"><option value="">すべての年</option></select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">日付</label>
                            <input type="date" id="filter-date" class="w-full border border-slate-200 rounded-xl p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">カテゴリー</label>
                            <select id="filter-category" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none"><option value="">すべてのカテゴリー</option></select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">場所</label>
                            <select id="filter-location" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none"><option value="">すべての場所</option></select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">位置</label>
                            <select id="filter-position" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none"><option value="">すべての位置</option></select>
                        </div>
                        
                        <!-- ★シークレットパスワード入力欄 -->
                        <div class="pt-4 border-t border-slate-100">
                            <label class="block text-xs font-medium text-slate-400 mb-1 flex items-center gap-1">
                                <i data-lucide="lock" class="w-3 h-3"></i> パスワード (任意)
                            </label>
                            <input type="password" id="secret-pass" placeholder="限定解除パス" class="w-full border border-slate-200 rounded-xl p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        
                        <div class="flex gap-2 mt-2">
                            <button id="reset-filters" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 rounded-xl text-sm transition">リセット</button>
                            <!-- ★データ再取得ボタン -->
                            <button id="reload-btn" class="w-1/2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-medium py-2 rounded-xl text-sm transition">更新</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側：動画リスト -->
            <div class="md:col-span-3 space-y-4">
                <div class="flex justify-between items-center bg-white px-5 py-3 rounded-2xl shadow-sm border border-slate-100">
                    <span class="text-sm font-medium text-slate-600">検索結果: <strong id="result-count" class="text-indigo-600">0</strong> 件</span>
                    <span id="loading-msg" class="text-xs text-indigo-500 flex items-center gap-1 transition-all duration-300"></span>
                </div>
                
                <div id="video-list" class="space-y-4"></div>
                
                <div id="pagination-controls" class="flex justify-center items-center gap-4 mt-6"></div>
            </div>
        </div>
    </div>

    <!-- スクリプト -->
    <script>
lucide.createIcons();

        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyePjHRyAt3gLQh5N5-M8qZYGk4Z0PPuyaeuqdLHj56hR0D5eBRMEkX_x4DA35cPJM/exec';
        const SECRET_TOKEN = 'takarabune-keiko-2026';
        
        let videos = [];
        let filterSettings = {}; // ★追加：GASから受け取った並び順設定を入れる箱
        let currentPage = 1;
        const itemsPerPage = 10;

        const filterCategory = document.getElementById('filter-category');
        const filterYear = document.getElementById('filter-year');
        const filterDate = document.getElementById('filter-date');
        const filterLocation = document.getElementById('filter-location');
        const filterPosition = document.getElementById('filter-position');
        const secretPassEl = document.getElementById('secret-pass');
        
        const videoListEl = document.getElementById('video-list');
        const loadingMsg = document.getElementById('loading-msg');
        const paginationEl = document.getElementById('pagination-controls');

        async function fetchVideos() {
            loadingMsg.style.display = 'flex';
            
            const userPass = secretPassEl.value.trim();
            // ★キャッシュ構造が変わるので名前を v2 に変更してリセット
            const cacheKey = 'takarabune_v2_cache_' + (userPass || 'public');
            
            const cachedData = localStorage.getItem(cacheKey);
            if (cachedData) {
                const parsed = JSON.parse(cachedData);
                videos = parsed.videos || [];
                filterSettings = parsed.settings || {}; // 設定データもキャッシュから復元
                updateFilterOptions();
                renderVideos();
                loadingMsg.innerHTML = '<i data-lucide="refresh-cw" class="w-4 h-4 animate-spin text-slate-400"></i><span class="text-slate-400">最新を確認中...</span>';
                lucide.createIcons();
            } else {
                loadingMsg.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>読込中...';
                lucide.createIcons();
            }

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ token: SECRET_TOKEN, pass: userPass }),
                    redirect: 'follow'
                });
                
                const data = await res.json();
                
                if (data.error) {
                    alert('アクセスが拒否されました。設定を確認してください。');
                    return;
                }
                
                // ★データ構造が { videos: [...], settings: {...} } になったので切り分ける
                let fetchedVideos = (data.videos || []).filter(v => v.date); 
                filterSettings = data.settings || {};

                // --- アンロック演出 ---
                const TARGET_CATEGORY = 'アーカイブ';
                const hasSecret = fetchedVideos.some(v => v.isSecret === true);
                const headerEl = document.getElementById('main-header');
                const unlockBadge = document.getElementById('unlock-badge');
                const passInput = document.getElementById('secret-pass');

                if (hasSecret) {
                    headerEl.classList.remove('bg-indigo-600');
                    headerEl.classList.add('bg-slate-800');
                    unlockBadge.style.display = 'inline-flex';
                    passInput.classList.add('border-amber-500', 'bg-amber-50', 'text-amber-700');
                } else {
                    headerEl.classList.add('bg-indigo-600');
                    headerEl.classList.remove('bg-slate-800');
                    unlockBadge.style.display = 'none';
                    passInput.classList.remove('border-amber-500', 'bg-amber-50', 'text-amber-700');
                }
                
                fetchedVideos.forEach(v => {
                    if (v.date) {
                        const d = new Date(v.date);
                        if (!isNaN(d.getTime())) {
                            const y = d.getFullYear();
                            const m = String(d.getMonth() + 1).padStart(2, '0');
                            const day = String(d.getDate()).padStart(2, '0');
                            v.date = `${y}-${m}-${day}`;
                        } else if (typeof v.date === 'string' && v.date.includes('T')) {
                            v.date = v.date.split('T')[0];
                        }
                    }
                });
                
                if (JSON.stringify(videos) !== JSON.stringify(fetchedVideos) || !cachedData) {
                    videos = fetchedVideos;
                    // 動画データと設定データの両方をキャッシュに保存
                    localStorage.setItem(cacheKey, JSON.stringify({ videos: videos, settings: filterSettings }));
                    updateFilterOptions();
                    renderVideos();
                }
                
                loadingMsg.innerHTML = '<i data-lucide="check" class="w-4 h-4 text-emerald-500"></i><span class="text-emerald-600">最新です</span>';
                lucide.createIcons();
                setTimeout(() => { loadingMsg.style.opacity = '0'; }, 2000);

            } catch (e) {
                console.error(e);
                if (!cachedData) {
                    alert('データの読み込みに失敗しました。');
                    loadingMsg.style.display = 'none';
                } else {
                    loadingMsg.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-rose-400"></i><span class="text-rose-400">オフライン表示</span>';
                    lucide.createIcons();
                }
            }
        }

        function updateFilterOptions() {
            // ★スプレッドシートの「設定」シートの内容を使って並び替える最強の関数
            const sortBySettings = (items, settingKey) => {
                const orderArray = filterSettings[settingKey] || [];
                return items.sort((a, b) => {
                    let indexA = orderArray.indexOf(a);
                    let indexB = orderArray.indexOf(b);
                    // 設定シートにないものは、一番後ろ(999)に回す
                    if (indexA === -1) indexA = 999;
                    if (indexB === -1) indexB = 999;
                    // 両方とも設定シートにない場合は、あいうえお順に並べる
                    if (indexA === indexB) return String(a).localeCompare(String(b));
                    return indexA - indexB;
                });
            };

            const getUnique = key => [...new Set(videos.map(v => v[key]).filter(x => x))];
            
            // 各項目を取得して、設定シートの順番にソートする！
            let categories = sortBySettings(getUnique('category'), 'カテゴリー');
            let locations = sortBySettings(getUnique('location'), '場所');
            let positions = sortBySettings(getUnique('position'), '位置');
            let years = [...new Set(videos.map(v => v.date ? v.date.split('-')[0] : null).filter(x => x))].sort().reverse();
            
            const fillSelect = (el, opts, prefix) => {
                const current = el.value;
                el.innerHTML = `<option value="">すべての${prefix}</option>` + opts.map(o => `<option value="${o}" ${o === current ? 'selected' : ''}>${o}${prefix==='年'?'年':''}</option>`).join('');
            };

            fillSelect(filterCategory, categories, 'カテゴリー');
            fillSelect(filterYear, years, '年');
            fillSelect(filterLocation, locations, '場所');
            fillSelect(filterPosition, positions, '位置');
        }

        function getYouTubeId(url) {
            if (!url) return null;
            try {
                if (url.includes("youtu.be/")) return url.split("youtu.be/")[1].split(/[?#]/)[0];
                const urlObj = new URL(url);
                if (urlObj.searchParams.has('v')) return urlObj.searchParams.get('v');
                if (urlObj.pathname.includes('/shorts/')) return urlObj.pathname.split('/shorts/')[1].split(/[?#]/)[0];
            } catch (e) { return null; }
            return null;
        }

        window.changePage = function(delta) {
            currentPage += delta;
            renderVideos();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function renderVideos() {
            const fCat = filterCategory.value;
            const fYear = filterYear.value;
            const fDate = filterDate.value;
            const fLoc = filterLocation.value;
            const fPos = filterPosition.value;

            const filtered = videos.filter(v => {
                if(!v.date) return false;
                if (fCat && v.category !== fCat) return false;
                if (fYear && v.date.split('-')[0] !== fYear) return false;
                if (fDate && v.date !== fDate) return false;
                if (fLoc && v.location !== fLoc) return false;
                if (fPos && v.position !== fPos) return false;
                return true;
            });

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
            document.getElementById('result-count').innerText = filtered.length;

            if (filtered.length === 0) {
                videoListEl.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 border border-slate-100"><i data-lucide="frown" class="w-10 h-10 mx-auto mb-2 opacity-50"></i><p class="text-sm">データが見つかりません</p></div>`;
                paginationEl.innerHTML = '';
                lucide.createIcons();
                return;
            }

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = filtered.slice(startIndex, endIndex);

            const isMobile = window.innerWidth <= 768;
            const targetAttr = isMobile ? '_self' : '_blank';

            videoListEl.innerHTML = currentItems.map(v => {
                const videoId = getYouTubeId(v.url);
                const thumbUrl = videoId ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` : '';
                
                let categoryBadgeStr = `<span class="text-xs font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg border border-slate-200">${v.category}</span>`;
                if (v.category !== '稽古') {
                    categoryBadgeStr = `<span class="text-xs font-bold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-200">${v.category}</span>`;
                }
                // H列にフラグが立っている秘密の動画なら鍵アイコンをつける
                if (v.isSecret) {
                    categoryBadgeStr = `<span class="text-xs font-bold text-white bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 shadow-sm flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3"></i>${v.category}</span>`;
                }

                return `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row gap-5 transition hover:shadow-md items-center">
                    
                    <a href="${v.url}" target="${targetAttr}" class="relative w-full sm:w-48 aspect-video flex-shrink-0 rounded-xl overflow-hidden bg-slate-900 shadow-inner group block cursor-pointer">
                        ${videoId 
                            ? `<img src="${thumbUrl}" alt="Thumbnail" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition group-hover:scale-105 duration-300">
                               <div class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/10 transition duration-300">
                                  <i data-lucide="play" class="w-10 h-10 text-white drop-shadow-md transform group-hover:scale-110 transition duration-300"></i>
                               </div>` 
                            : `<div class="w-full h-full flex flex-col items-center justify-center text-slate-400 bg-slate-100"><i data-lucide="image-off" class="w-6 h-6 mb-1"></i><span class="text-[10px]">URLエラー</span></div>`}
                    </a>

                    <div class="flex-grow flex flex-col sm:flex-row justify-between items-start w-full gap-4">
                        <div class="space-y-2 w-full">
                            
                            <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
                                ${categoryBadgeStr}
                                <span class="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-1.5">
                                    <i data-lucide="map-pin" class="w-5 h-5 text-indigo-500"></i>
                                    ${v.location}
                                </span>
                                <span class="text-lg sm:text-xl font-bold text-indigo-700">
                                    ${v.date}
                                </span>
                            </div>

                            <div class="flex flex-wrap items-baseline gap-x-4 gap-y-1 mt-1">
                                ${v.position ? `
                                    <span class="text-base sm:text-lg font-bold text-emerald-600 flex items-center gap-1">
                                        <i data-lucide="user" class="w-4 h-4"></i>
                                        ${v.position}
                                    </span>
                                ` : ''}
                                ${v.note ? `
                                    <span class="text-base sm:text-lg text-slate-600 font-medium">
                                        ${v.note}
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                        
                        <a href="${v.url}" target="${targetAttr}" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-6 py-3 rounded-xl font-medium flex items-center gap-2 transition shadow-sm w-full sm:w-auto justify-center flex-shrink-0 sm:self-center mt-2 sm:mt-0">
                            <i data-lucide="play-circle" class="w-5 h-5"></i> 再生
                        </a>
                    </div>
                </div>
                `;
            }).join('');
            
            if (totalPages > 1) {
                paginationEl.innerHTML = `
                    <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled class="opacity-50 cursor-not-allowed bg-slate-200 text-slate-500 font-medium px-4 py-2 rounded-xl text-sm"' : 'class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-medium px-4 py-2 rounded-xl text-sm transition"'}>
                        <i data-lucide="chevron-left" class="w-4 h-4 inline"></i> 前へ
                    </button>
                    <span class="text-sm font-medium text-slate-600 px-2">${currentPage} / ${totalPages} ページ</span>
                    <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled class="opacity-50 cursor-not-allowed bg-slate-200 text-slate-500 font-medium px-4 py-2 rounded-xl text-sm"' : 'class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-medium px-4 py-2 rounded-xl text-sm transition"'}>
                        次へ <i data-lucide="chevron-right" class="w-4 h-4 inline"></i>
                    </button>
                `;
            } else {
                paginationEl.innerHTML = '';
            }

            lucide.createIcons();
        }

        const filterElements = [filterCategory, filterYear, filterDate, filterLocation, filterPosition];
        filterElements.forEach(el => el.addEventListener('change', () => {
            currentPage = 1;
            renderVideos();
        }));
        
        document.getElementById('reset-filters').addEventListener('click', () => {
            filterElements.forEach(el => el.value = '');
            currentPage = 1;
            renderVideos();
        });
        
        document.getElementById('reload-btn').addEventListener('click', () => {
            currentPage = 1;
            fetchVideos();
        });

        window.addEventListener('resize', () => renderVideos());
        fetchVideos();
    </script>
</body>
</html>
